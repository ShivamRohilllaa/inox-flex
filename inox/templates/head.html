{% load static %}
{% load seo_tags %}
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="512x512" href="{% static 'images/favicon-512.png' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon-512.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
    <meta name="google-site-verification" content="PHtkcGDVcm7aL1v2KjCiOaq-WOpWELwaOR8DuwFhMsk" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-118J3GZT7L"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-118J3GZT7L');
    </script>
    
    <!-- SEO Meta Tags -->
    {% seo_meta_tags %}
    <!-- CSS Files
    ================================================== -->
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet" type="text/css" id="bootstrap">
    <link href="{% static "css/plugins.css" %}" rel="stylesheet" type="text/css" >
    <link href="{% static "css/swiper.css" %}" rel="stylesheet" type="text/css" >
    <link href="{% static "css/style.css" %}" rel="stylesheet" type="text/css" >
    <link href="{% static "css/coloring.css" %}" rel="stylesheet" type="text/css" >
    <!-- color scheme -->
    <link id="colors" href="{% static "css/colors/scheme-01.css" %}" rel="stylesheet" type="text/css" >
    
    <!-- Google Translate -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            // Initialize for desktop
            if (document.getElementById('google_translate_element')) {
                new google.translate.TranslateElement({
                    pageLanguage: 'en',
                    includedLanguages: 'en,hi,es,fr,de,it,pt,ru,ja,ko,zh-CN,zh-TW,ar,tr,nl,pl,sv,da,no,fi,cs,hu,ro,bg,el,he,th,vi,id,ms',
                    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                    autoDisplay: false
                }, 'google_translate_element');
            }
            
            // Initialize for mobile - use longer delay to ensure DOM is ready
            setTimeout(function() {
                const mobileElement = document.getElementById('google_translate_element_mobile');
                if (mobileElement && !mobileElement.querySelector('.goog-te-gadget')) {
                    try {
                        new google.translate.TranslateElement({
                            pageLanguage: 'en',
                            includedLanguages: 'en,hi,es,fr,de,it,pt,ru,ja,ko,zh-CN,zh-TW,ar,tr,nl,pl,sv,da,no,fi,cs,hu,ro,bg,el,he,th,vi,id,ms',
                            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                            autoDisplay: false
                        }, 'google_translate_element_mobile');
                    } catch(e) {
                        console.log('Mobile translate init error:', e);
                    }
                }
            }, 300);
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<link href="{% static 'css/site-refinements.css' %}" rel="stylesheet">
</head>
