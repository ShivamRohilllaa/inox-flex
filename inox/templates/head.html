{% load static %}
<head>
    <title>Inox Flex</title>
    <link rel="icon" href="{% static 'images/icon.png' %}" type="image/gif" sizes="16x16">
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1.0" name="viewport" >
    <meta content="Inox Flex" name="description" >
    <meta content="" name="keywords" >
    <meta content="" name="author" >
    <!-- CSS Files
    ================================================== -->
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet" type="text/css" id="bootstrap">
    <link href="{% static "css/plugins.css" %}" rel="stylesheet" type="text/css" >
    <link href="{% static "css/swiper.css" %}" rel="stylesheet" type="text/css" >
    <link href="{% static "css/style.css" %}" rel="stylesheet" type="text/css" >
    <link href="{% static "css/coloring.css" %}" rel="stylesheet" type="text/css" >
    <!-- color scheme -->
    <link id="colors" href="{% static "css/colors/scheme-01.css" %}" rel="stylesheet" type="text/css" >
    
    <!-- Google Translate -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            // Initialize for desktop
            if (document.getElementById('google_translate_element')) {
                new google.translate.TranslateElement({
                    pageLanguage: 'en',
                    includedLanguages: 'en,hi,es,fr,de,it,pt,ru,ja,ko,zh-CN,ar',
                    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                    autoDisplay: false
                }, 'google_translate_element');
            }
            
            // Initialize for mobile - use longer delay to ensure DOM is ready
            setTimeout(function() {
                const mobileElement = document.getElementById('google_translate_element_mobile');
                if (mobileElement && !mobileElement.querySelector('.goog-te-gadget')) {
                    try {
                        new google.translate.TranslateElement({
                            pageLanguage: 'en',
                            includedLanguages: 'en,hi,es,fr,de,it,pt,ru,ja,ko,zh-CN,ar',
                            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                            autoDisplay: false
                        }, 'google_translate_element_mobile');
                    } catch(e) {
                        console.log('Mobile translate init error:', e);
                    }
                }
            }, 300);
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</head>
